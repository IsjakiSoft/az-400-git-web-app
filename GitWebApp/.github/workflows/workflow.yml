name: PipelineWorkflow

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs: 
  build:
    name: Azure Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Azure Pipelines Action
        uses: Azure/piplines@v1
        with:
          azure-devops-project-url: 'https://dev.azure.com/vadymkorzh/AZ-400-01'
          azure-pipeline-name: 'webapp'
          azure-devops-token: ${{ secrets.AZURE_DEVOPS_TOKEN }}

  